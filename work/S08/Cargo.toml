[package]
name = "lcars-monitor"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "An LCARS-inspired terminal system monitor"
license = "MIT"
default-run = "lcars-mon"

[lib]
name = "lcars_monitor"
path = "src/lib.rs"

[[bin]]
name = "lcars-mon"
path = "src/main.rs"

[[bin]]
name = "lcars-capture"
path = "src/bin/capture.rs"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.189"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
unicode-width = "0.2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
